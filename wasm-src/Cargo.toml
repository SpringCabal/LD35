[workspace]
resolver = "2"
members = ["rules-synced", "shared", "ui"]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"

[workspace.dependencies]
spring = { package = "spring-sdk", git = "https://github.com/gajop/spring-rust", rev = "0f0ee80fa0ee620bc2988c64559feb3cbd163e10" }
spring-addons = { package = "spring-addons", git = "https://github.com/gajop/spring-rust", rev = "0f0ee80fa0ee620bc2988c64559feb3cbd163e10" }
springcabal = { path = "../../../../springcabal-rs/crates/springcabal" }
springcabal-control = { path = "../../../../springcabal-rs/crates/springcabal-control" }
# The screen treatment reproduces gfx_eyes_effect.lua's transition curves, and
# core has no trig in a no_std wasm target.
libm = "0.2"
